# Edge container for the centia-agent stack. Traefik sends everything under
# /agent for the host app's hostname here; we strip the prefix and proxy to
# the agent server, which listens on /api/*.
#
#   browser  ->  https://<host>/agent/api/chat
#   traefik  ->  nginx:80          /agent/api/chat
#   nginx    ->  agent:8790        /api/chat
#
# The host app calls relative URLs (/agent/api/chat), so it stays same-origin
# and the server's wildcard CORS is never exercised by a browser.

server {
    listen 80;
    server_name _;

    # Resolve the agent service through Docker's embedded DNS at request time
    # (variable upstream) so nginx starts even when the agent task isn't up
    # yet - Swarm ignores depends_on.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $agent "agent:8790";

    # Traefik health target: cheap 200 without touching the agent.
    location = /agent/healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location /agent/ {
        # Prefix strip: /agent/api/chat -> /api/chat. Variable upstream means
        # the URI has to be rewritten explicitly.
        rewrite ^/agent/(.*)$ /$1 break;
        proxy_pass http://$agent;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # TLS is terminated upstream (ELB); pass the proto it forwards.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Prefix /agent;

        # /api/chat streams NDJSON events as they happen. Buffering would hold
        # them back until the response ends; the server also sends
        # X-Accel-Buffering: no, which nginx honours only when proxy_ignore_
        # headers doesn't strip it (it doesn't here).
        proxy_buffering off;
        proxy_cache     off;
        proxy_request_buffering off;
        gzip            off;

        # An agent turn is many LLM + tool rounds and can run for minutes.
        proxy_connect_timeout 10s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;

        client_max_body_size 10m;
    }

    # Nothing else is served from this stack.
    location / {
        return 404;
    }
}
